server:
  port: 8080

spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3000"
              - "https://www.roomsafar.com"
              - "http://roomsafar.com"
              - "https://*.replit.dev"
              - "https://*.repl.co"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            exposed-headers: "*"
            allow-credentials: true
            max-age: 3600

      routes:
        # USER SERVICE
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /auth/${segment}

        # ROOM SERVICE
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**
          filters:
            - RewritePath=/api/rooms/(?<segment>.*), /api/rooms/${segment}

        # BOOKING SERVICE
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**

        # FAVORITES SERVICE
        - id: favorites-service
          uri: lb://favorites-service
          predicates:
            - Path=/api/favorites/**

        # PAYMENT SERVICE
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: "this_is_a_very_secret_key_change_in_prod_1234567890_secure_key"
  expiration: 86400000
