server:
  port: 8082

spring:
  application:
    name: payment-service

  # Razorpay Configuration
  razorpay:
    key: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
  instance:
    hostname: localhost
    prefer-ip-address: true
