server:
  port: 8083

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/roomsafar_users
    username: postgres
    password: root
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update   # FIXED: no table loss
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

google:
  clientId: 520363383072-203tuokk6j9mhbk8m03pptooo0aaemvp.apps.googleusercontent.com

jwt:
  secret: "this_is_a_very_secret_key_change_in_prod_1234567890_secure_key"
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: false      # ⭐ DO NOT use WiFi IP
    ip-address: 127.0.0.1         # ⭐ Always use localhost
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.roomsafar.user_service: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.google.api.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
